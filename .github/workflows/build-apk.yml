
name: Build YadNare APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'YadNareAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          unzip -o YadNareAndroid.zip -d source
          find source -maxdepth 3 -type f | head -80

      - name: Build APK
        run: |
          cd source
          PROJECT_DIR="$(find . -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YadNare-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
